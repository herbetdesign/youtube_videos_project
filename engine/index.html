<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Financial Animation Kit — Preview</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="toolbar"><strong>Financial Animation Kit</strong><span id="episode-title">Carregando episódio…</span><div class="controls"><button id="prev">◀</button><button id="play">▶ Reproduzir</button><button id="next">▶</button></div></header>
  <main><div id="stage-wrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Prévia da animação"><g id="camera-layer"><image id="background" x="0" y="0" width="1920" height="1080"/><g id="object-layer"></g><g id="character-layer"></g><g id="overlay-layer"></g></g></svg></div>
  <section class="timeline"><div class="progress-track"><div id="progress"></div></div><div><span id="time-label">00:00 / 00:00</span><span id="scene-label"></span></div></section></main>
  <p class="hint">Prévia local em SVG. Para gerar MP4, use os scripts da pasta <code>render/</code>.</p>
  <script src="engine.js"></script>
</body></html>
